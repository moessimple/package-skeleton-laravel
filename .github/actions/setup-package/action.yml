name: Setup package
description: PHP, Composer cache and the package's dependencies at their newest allowed versions.

inputs:
  php-version:
    description: PHP version to install.
    default: '8.5'
  coverage:
    description: PHP coverage driver (none or xdebug).
    default: none

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
        ini-values: error_reporting=E_ALL
        tools: composer:v2
        coverage: ${{ inputs.coverage }}

    - name: Get Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer dependencies
      # Caches the download cache, not vendor/: Composer loads plugins from an existing vendor/
      # before installing, so a stale vendor/ from restore-keys runs outdated plugin code.
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-php-${{ inputs.php-version }}-composer-${{ hashFiles('composer.json') }}
        restore-keys: ${{ runner.os }}-php-${{ inputs.php-version }}-composer-

    - name: Install Composer dependencies
      # A package commits no composer.lock, so CI resolves what a consuming app would get today.
      shell: bash
      run: composer update --prefer-dist --no-interaction --no-progress
